[project]
name = "meter-digit-reader"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "onnxruntime-gpu>=1.18.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "gdown>=4.7.3",
    "pillow>=10.0.0",
    "pillow-heif>=0.13.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlmodel>=0.0.18",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
